[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-session-profanity-rate"
version = "0.1.0"
description = "Agent-in-the-loop profanity-rate analysis for local AI session messages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ai-session-profanity-rate = "ai_session_profanity_rate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_session_profanity_rate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
